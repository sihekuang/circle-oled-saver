<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>
  </div>
  <script src="background/BackgroundProvider.js"></script>
  <script src="background/AnimatedBackgroundProvider.js"></script>
  <script src="background/StaticBackgroundProvider.js"></script>
  <script src="providers/ContentProvider.js"></script>
  <script src="providers/ClockProvider.js"></script>
  <script src="providers/StockProvider.js"></script>
  <script src="providers/SystemInfoProvider.js"></script>
  <script src="ContentRotator.js"></script>
  <script src="themes/ThemeProvider.js"></script>
  <script src="themes/MinimalThemeProvider.js"></script>
  <script src="themes/SoftThemeProvider.js"></script>
  <script src="themes/GlassyThemeProvider.js"></script>
  <script src="themes/AbstractThemeProvider.js"></script>
  <script src="IconRegistry.js"></script>
  <script>
    // Preload icon images
    window.iconRegistry.preloadIcons([
      'clock',
      'cpu',
      'hard-drive',
      'battery',
      'battery-low',
      'battery-medium',
      'battery-full',
      'battery-charging',
      'trending-up',
      'bar-chart-2',
      'help-circle'
    ]).catch(err => console.error('Failed to preload icons:', err));
  </script>
  <script src="overlay.js"></script>
</body>
</html>
