<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>OLED Saver Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <h1>OLED Saver Settings</h1>

    <section class="setting-group">
      <label class="toggle-label">
        <span>Enable OLED Saver</span>
        <input type="checkbox" id="enabled">
        <span class="toggle-slider"></span>
      </label>
    </section>

    <section class="setting-group">
      <label for="idle-timeout">
        Idle timeout: <span id="timeout-value">5</span> minutes
      </label>
      <input type="range" id="idle-timeout" min="1" max="30" value="5">
    </section>

    <section class="setting-group">
      <label class="toggle-label">
        <span>Start at login</span>
        <input type="checkbox" id="launch-at-login">
        <span class="toggle-slider"></span>
      </label>
    </section>

    <section class="setting-group">
      <h2>Playlists</h2>
      <div id="playlist-list"></div>

      <div class="add-playlist">
        <input type="text" id="playlist-name" placeholder="Name">
        <input type="text" id="playlist-url" placeholder="YouTube URL">
        <button id="add-playlist-btn">Add</button>
      </div>
    </section>
  </div>

  <script src="settings.js"></script>
</body>
</html>
