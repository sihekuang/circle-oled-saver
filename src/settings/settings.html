<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Saver Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <h1>OLED Saver Settings</h1>

    <section class="setting-group">
      <label class="toggle-label">
        <span>Enable OLED Saver</span>
        <input type="checkbox" id="enabled">
        <span class="toggle-slider"></span>
      </label>
    </section>

    <section class="setting-group">
      <label for="idle-timeout">Idle timeout</label>
      <div class="timeout-input">
        <input type="range" id="idle-timeout" min="5" max="300" value="10">
        <input type="number" id="timeout-value" min="5" max="300" value="10"> seconds
      </div>
    </section>

    <section class="setting-group">
      <label class="toggle-label">
        <span>Start at login</span>
        <input type="checkbox" id="launch-at-login">
        <span class="toggle-slider"></span>
      </label>
    </section>
  </div>

  <script src="settings.js"></script>
</body>
</html>
