<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 512 512" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="256" cy="256" r="150" stroke-width="36"/>
      <path d="M 150 260 C 220 200, 315 175, 382 205" stroke-width="34"/>
      <path d="M 162 320 C 235 270, 325 250, 402 270" stroke-width="34"/>
    </svg>
    <span id="message">Always On: Enabled</span>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('show-toast', (event, message) => {
      document.getElementById('message').textContent = message;
      document.getElementById('toast').classList.add('visible');
    });
  </script>
</body>
</html>
